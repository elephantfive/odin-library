<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="style.css">
    <script src="object-test.js" defer></script>
</head>
<body>
    <div class="sidebar">Sidebar!</div>
    <div class="header">Header!</div>
    <div class="main-content">
        <dialog>
            <form action="">
                <div class="form-row">
                    <label for="title">Enter title of book:</label>
                    <input type="text" name="title" id="title" required>
                </div>
                <div class="form-row">
                    <label for="author">Enter author of book:</label>
                    <input type="text" name="author" id="author" required>
                </div>
                <div class="form-row">
                    <label for="pages">Enter page count:</label>
                    <input type="number" name="pages" id="pages" required>
                </div>
                <div class="form-row">
                    <label for="read">Read?</label>
                    <input type="checkbox" name="read" id="read">
                </div>
                <div class="form-row">
                    <input type="submit" value="Submit">
                </div>

            </form>
            
        </dialog>
        <div class="library">
            <div class="books">
                <h1>Library</h1>
            </div>
            <button class="add-new-book">Add new book</button>
        </div>
    </div>
    
</body>
</html>
